<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>UniPlan · 课表规划</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">UniPlan</a>
      <div class="top-actions">
        <select id="termSelect" class="pill-select" aria-label="学期"></select>
        <button id="themeToggle" class="link" type="button" aria-label="切换深色模式"></button>
      </div>
    </div>
  </header>

  <main class="main">
    <form id="profileForm" class="setup" novalidate>
      <div id="setupFull">
        <div class="field">
          <label class="field-label" for="unitQuery">课程</label>
          <div class="course-box">
            <div id="chosenUnits" class="chips" aria-live="polite"></div>
            <div class="course-input-wrap">
              <input id="unitQuery" type="text" autocomplete="off" spellcheck="false"
                     aria-controls="suggestions" aria-autocomplete="list" aria-expanded="false"
                     placeholder="输入课程代码，如 ENGG2112" maxlength="32">
              <ul id="suggestions" role="listbox" aria-label="课程建议" hidden></ul>
            </div>
          </div>
          <p class="field-error" id="unitError" aria-live="polite"></p>
        </div>

        <div class="field">
          <label class="field-label" for="sayText">用一句话说说你的情况（可选）</label>
          <div class="say-box">
            <textarea id="sayText" rows="2" maxlength="500" spellcheck="false"
                      placeholder="例如：我周五要打工，不想一大早上课，课之间别等太久"></textarea>
            <button type="button" class="button" id="sayRead">识别</button>
          </div>
          <div id="sayResult" class="say-result" aria-live="polite" hidden></div>
          <p class="field-error" id="sayError" aria-live="polite"></p>
        </div>

        <div class="field">
          <span class="field-label">不想上课的时间</span>
          <div class="token-row">
            <div id="blocks" class="tokens"></div>
            <button type="button" class="preset" data-preset="mon">周一全天</button>
            <button type="button" class="preset" data-preset="fri">周五全天</button>
            <button type="button" class="preset" data-preset="early">10 点前</button>
            <button type="button" class="preset" data-preset="late">18 点后</button>
            <button type="button" class="preset" id="customToggle">自定义…</button>
          </div>
          <div id="customBlock" class="custom-block" hidden>
            <select id="customDay" class="select" aria-label="星期">
              <option value="1">周一</option><option value="2">周二</option><option value="3">周三</option>
              <option value="4">周四</option><option value="5">周五</option><option value="6">周六</option><option value="7">周日</option>
            </select>
            <select id="customStart" class="select time-select" aria-label="开始"></select>
            <span class="dash">–</span>
            <select id="customEnd" class="select time-select" aria-label="结束"></select>
            <button type="button" class="button" id="customAdd">添加</button>
          </div>
          <p class="field-error" id="windowError" aria-live="polite"></p>
        </div>

        <details class="drawer" id="moreSettings">
          <summary>更多设置<span id="moreCount" class="count" hidden></span></summary>
          <div class="settings">
            <section class="setting-group">
              <h3>每天</h3>
              <div class="setting">
                <span class="setting-label">希望上课时间</span>
                <span class="time-range"><select id="preferredStart" class="select time-select" aria-label="最早"></select><span class="dash">–</span><select id="preferredEnd" class="select time-select" aria-label="最晚"></select></span>
              </div>
              <div class="setting">
                <span class="setting-label">最多上课</span>
                <div class="segmented" data-target="maxDaily"><button type="button" data-value="">不限</button><button type="button" data-value="3">3 时</button><button type="button" data-value="4">4 时</button><button type="button" data-value="6">6 时</button><button type="button" data-value="8">8 时</button></div>
                <input type="hidden" id="maxDaily" value="">
              </div>
              <div class="setting">
                <span class="setting-label">最长在校</span>
                <div class="segmented" data-target="maxSpan"><button type="button" data-value="">不限</button><button type="button" data-value="5">5 时</button><button type="button" data-value="7">7 时</button><button type="button" data-value="9">9 时</button></div>
                <input type="hidden" id="maxSpan" value="">
              </div>
              <div class="setting">
                <label class="check"><input id="lunchOn" type="checkbox"> 留出午饭时间</label>
                <span class="time-range" id="lunchRow" hidden><select id="lunchStart" class="select time-select" aria-label="午饭最早"></select><span class="dash">–</span><select id="lunchEnd" class="select time-select" aria-label="午饭最晚"></select><select id="lunchMinutes" class="select" aria-label="至少空出"><option value="20">留 20 分</option><option value="30" selected>留 30 分</option><option value="45">留 45 分</option><option value="60">留 60 分</option></select></span>
              </div>
            </section>
            <section class="setting-group">
              <h3>每周</h3>
              <div class="setting">
                <span class="setting-label">最多到校</span>
                <div class="segmented" data-target="maxDays"><button type="button" data-value="">不限</button><button type="button" data-value="1">1 天</button><button type="button" data-value="2">2 天</button><button type="button" data-value="3">3 天</button><button type="button" data-value="4">4 天</button></div>
                <input type="hidden" id="maxDays" value="">
              </div>
            </section>
            <section class="setting-group">
              <h3>路上</h3>
              <div class="setting">
                <span class="setting-label">单程通勤</span>
                <div class="segmented" data-target="commute"><button type="button" data-value="">不算</button><button type="button" data-value="15">15 分</button><button type="button" data-value="30">30 分</button><button type="button" data-value="45">45 分</button><button type="button" data-value="60">1 时</button><button type="button" data-value="90">1.5 时</button></div>
                <input type="hidden" id="commute" value="">
              </div>
              <div class="setting">
                <span class="setting-label">换楼至少留</span>
                <div class="segmented" data-target="transition"><button type="button" data-value="">0</button><button type="button" data-value="5">5 分</button><button type="button" data-value="10">10 分</button><button type="button" data-value="15">15 分</button></div>
                <input type="hidden" id="transition" value="">
              </div>
              <div class="setting">
                <span class="setting-label">按楼间距离算步行</span>
                <div class="segmented" data-target="walkSpeed"><button type="button" data-value="">不算</button><button type="button" data-value="80">正常</button><button type="button" data-value="55">慢些</button><button type="button" data-value="35">行动不便</button></div>
                <input type="hidden" id="walkSpeed" value="">
              </div>
            </section>
            <section class="setting-group">
              <h3>选班</h3>
              <div class="setting">
                <label class="check"><input id="inPerson" type="checkbox"> 只要现场课</label>
              </div>
              <div class="setting">
                <span class="setting-label">避开余位少的班</span>
                <div class="segmented" data-target="minSeats"><button type="button" data-value="">不限</button><button type="button" data-value="2">少于 2</button><button type="button" data-value="5">少于 5</button><button type="button" data-value="10">少于 10</button></div>
                <input type="hidden" id="minSeats" value="">
              </div>
            </section>
          </div>
          <p class="field-error" id="settingsError" aria-live="polite"></p>
        </details>

        <div class="submit-row">
          <button id="submitButton" class="button primary large" type="submit">生成课表</button>
          <label class="consent"><input id="consent" type="checkbox"> 保存结果用于 UniPlan 研究（可撤回）</label>
        </div>
        <div id="saved" class="saved" hidden></div>
      </div>

      <div id="setupSummary" class="setup-summary" hidden>
        <div id="summaryChips" class="summary-chips"></div>
        <button type="button" class="button ghost" id="editSetup">修改</button>
      </div>
    </form>

    <section id="result" class="result" aria-live="polite" hidden></section>
  </main>

  <footer class="footer">
    <span>数据来自悉尼大学公开课表的本地快照，座位和时间以学校选课系统为准。</span>
    <button type="button" class="link" id="withdrawToggle">撤回已保存的数据</button>
    <form id="withdrawForm" hidden>
      <input id="withdrawCode" type="text" autocomplete="off" spellcheck="false" maxlength="32" placeholder="32 位参与码">
      <button class="button" type="submit">删除</button>
      <span id="withdrawMessage" aria-live="polite"></span>
    </form>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
